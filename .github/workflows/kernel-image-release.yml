# 放到 mcajun87/Rocky7842_android_kernel_samsung_exynos9820 仓库的
# .github/workflows/kernel-image-release.yml
#
# 编一份精简 Image；发布与否由你决定。
# 触发：
#   1) 手动：Actions → Kernel image release → Run workflow
#      publish 填 true 才发布；填 false 只编译并上传 Artifact
#   2) 打 tag：git push origin lean-v1  → 只编译 + Artifact，不发布
#      git push origin pub-v1         → 编译 + 发布（pub- 前缀代表你确认要发）
#
# 发布开关只有一个：publish 输入，或 tag 加 pub- 前缀。

name: Kernel image release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '是否发布到 Releases（true/false；false 只编不发）'
        required: false
        default: 'false'
      tag:
        description: '发布 tag，留空自动生成 d1x-image-日期-时间'
        required: false
        default: ''
      ref:
        description: '要编的分支，留空用 lineage-24.0'
        required: false
        default: 'lineage-24.0'
      variant:
        description: 'stock 或 lean'
        required: false
        default: 'lean'
  push:
    tags:
      - 'v*'
      - 'lean-*'
      - 'd1x-*'
      - 'pub-*'

permissions:
  contents: write

concurrency:
  group: kernel-image-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CLANG_TAG: android-16.0.0_r1
  CLANG_VER: clang-r547379
  RECOVERY_PARTITION: 67633152
  DTBO_BYTES: 974848
  BOOT_HEADER_BYTES: 2048

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /opt/hostedtoolcache /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Resolve tag and variant
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            VARIANT="${{ inputs.variant }}"
          else
            TAG="${{ github.ref_name }}"
            case "$TAG" in
              lean-*|v*) VARIANT="lean" ;;
              *)         VARIANT="stock" ;;
            esac
          fi
          [ -n "$TAG" ] || TAG="d1x-image-$(date -u +%Y%m%d-%H%M)"
          [ -n "$VARIANT" ] || VARIANT="lean"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VARIANT=$VARIANT" >> "$GITHUB_ENV"
          echo "使用 tag=$TAG，variant=$VARIANT"

      - name: Toolchain deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev device-tree-compiler zip \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Fetch clang
        run: |
          curl -fsSL -o /tmp/clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/${CLANG_TAG}/${CLANG_VER}.tar.gz"
          mkdir -p "$HOME/clang"
          tar -xf /tmp/clang.tar.gz -C "$HOME/clang"
          "$HOME/clang/bin/clang" --version | head -1

      - name: Build Image
        run: |
          set -eu
          cp arch/arm64/configs/exynos9820-d1x_defconfig arch/arm64/configs/d1x_release_defconfig
          if [ "$VARIANT" = "lean" ]; then
            ./scripts/config --file arch/arm64/configs/d1x_release_defconfig \
              -d DEBUG_INFO -d DEBUG_KERNEL -d KALLSYMS_ALL \
              -d IKCONFIG -d IKCONFIG_PROC \
              -d FTRACE -d TRACEPOINTS -d FTRACE_SYSCALLS \
              -d KPROBES -d BPF_SYSCALL -d PROFILING \
              -d SCHEDSTATS -d TASKSTATS -d TASK_DELAY_ACCT -d PSI \
              -d SLUB_DEBUG -d SECURITY_SELINUX_DEVELOP \
              -d MAGIC_SYSRQ -d BLK_DEV_RAM -d SAMPLES
          fi
          echo "enabled: $(grep -c '^CONFIG_.*=y' arch/arm64/configs/d1x_release_defconfig)"
          export PATH="$HOME/clang/bin:$PATH"
          make -j"$(nproc)" ARCH=arm64 O=out \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- d1x_release_defconfig
          make -j"$(nproc)" ARCH=arm64 O=out \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- Image
          mkdir -p dist
          cp out/arch/arm64/boot/Image "dist/Image-$TAG"
          ( cd dist && sha256sum "Image-$TAG" > SHA256SUMS.txt )
          BYTES=$(stat -c%s "dist/Image-$TAG")
          BUDGET=$(( RECOVERY_PARTITION - BYTES - DTBO_BYTES - BOOT_HEADER_BYTES ))
          {
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| tag | $TAG |"
            echo "| variant | $VARIANT |"
            echo "| Image 字节 | $BYTES |"
            echo "| 留给 ramdisk（压缩后） | $BUDGET |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write notes
        run: |
          set -eu
          BYTES=$(stat -c%s "dist/Image-$TAG")
          BUDGET=$(( RECOVERY_PARTITION - BYTES - DTBO_BYTES - BOOT_HEADER_BYTES ))
          {
            echo "# d1x 内核 Image · $TAG"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| Image 字节 | $BYTES |"
            echo "| 去掉 dtbo 与 header 后给 ramdisk 的额度 | $BUDGET |"
            echo "| variant | $VARIANT |"
            echo "| 源码 ref | $(git rev-parse --short HEAD) |"
            echo ""
            echo "## 用法"
            echo ""
            echo '```'
            echo "adb push Image /sdcard/Image"
            echo "# 或用文件管理器丢到 device/samsung/d1x/prebuilt/Image 后重编："
            echo "mka recoveryimage"
            echo '```'
            echo ""
            echo "预算为负说明这份 Image 单靠自己就超出 67,633,152 的分区上限。"
          } > dist/NOTES.md

      - name: Upload artifact（不发也留一份）
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ env.TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release（可选，看 publish 开关）
        if: ${{ inputs.publish == 'true' || startsWith(github.ref_name, 'pub-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Image-"$TAG" dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file dist/NOTES.md
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发时 tag 往往还不存在，用它指向本次实际编译的 commit
            gh release create "$TAG" dist/Image-"$TAG" dist/SHA256SUMS.txt \
              --target "$(git rev-parse HEAD)" \
              --title "d1x kernel Image $TAG" \
              --notes-file dist/NOTES.md
          else
            # tag 触发时 tag 已存在，不能再传 --target
            gh release create "$TAG" dist/Image-"$TAG" dist/SHA256SUMS.txt \
              --title "d1x kernel Image $TAG" \
              --notes-file dist/NOTES.md
          fi
          echo "发布地址：${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
