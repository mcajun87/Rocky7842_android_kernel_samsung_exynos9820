# 放到 mcajun87/Rocky7842_android_kernel_samsung_exynos9820 仓库的
# .github/workflows/kernel-image-size.yml
#
# 编译 Image 并量出真实字节数；可选一步发布到 Releases。
# 用法一（只量不发）：Actions → Run workflow，publish 留 false。
# 用法二（量完发）：publish 填 true，release_tag 可留空（自动用 d1x-image-日期-时间）。

name: kernel-image-size

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '跑完是否发布到 Releases'
        required: false
        default: 'false'
      release_tag:
        description: '发布 tag，留空自动生成'
        required: false
        default: ''
  push:
    branches: [lineage-24.0, lineage-24.0-ksu]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write

env:
  RECOVERY_PARTITION: 67633152
  DTBO_BYTES: 974848
  BOOT_HEADER_BYTES: 2048
  CLANG_TAG: android-16.0.0_r1
  CLANG_VER: clang-r547379

jobs:
  probe:
    name: ${{ matrix.branch }} · ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        branch: [lineage-24.0, lineage-24.0-ksu]
        variant: [stock, lean]

    steps:
      - name: Reclaim disk（默认 runner 只有 14G）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /opt/hostedtoolcache /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 1

      - name: Toolchain deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev device-tree-compiler zip \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Fetch clang r547379
        run: |
          curl -fsSL -o /tmp/clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/${CLANG_TAG}/${CLANG_VER}.tar.gz"
          mkdir -p "$HOME/clang"
          tar -xf /tmp/clang.tar.gz -C "$HOME/clang"
          "$HOME/clang/bin/clang" --version | head -1

      - name: Make defconfig
        run: |
          set -eu
          cp arch/arm64/configs/exynos9820-d1x_defconfig arch/arm64/configs/d1x_probe_defconfig
          if [ "${{ matrix.variant }}" = "lean" ]; then
            ./scripts/config --file arch/arm64/configs/d1x_probe_defconfig \
              -d DEBUG_INFO -d DEBUG_KERNEL -d KALLSYMS_ALL \
              -d IKCONFIG -d IKCONFIG_PROC \
              -d FTRACE -d TRACEPOINTS -d FTRACE_SYSCALLS \
              -d KPROBES -d BPF_SYSCALL -d PROFILING \
              -d SCHEDSTATS -d TASKSTATS -d TASK_DELAY_ACCT -d PSI \
              -d SLUB_DEBUG -d SECURITY_SELINUX_DEVELOP \
              -d MAGIC_SYSRQ -d BLK_DEV_RAM -d SAMPLES
          fi
          echo "enabled: $(grep -c '^CONFIG_.*=y' arch/arm64/configs/d1x_probe_defconfig)"

      - name: Build Image
        run: |
          set -eu
          export PATH="$HOME/clang/bin:$PATH"
          make -j"$(nproc)" ARCH=arm64 O=out \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- d1x_probe_defconfig
          make -j"$(nproc)" ARCH=arm64 O=out \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- Image

      - name: Package + report
        run: |
          set -eu
          BR="${{ matrix.branch }}"
          VR="${{ matrix.variant }}"
          IMG=out/arch/arm64/boot/Image
          BYTES=$(stat -c%s "$IMG")
          mkdir -p dist
          cp "$IMG" "dist/Image-$BR-$VR"
          printf '%s|%s|%s\n' "$BR" "$VR" "$BYTES" > "dist/size-$BR-$VR.txt"
          BUDGET=$(( RECOVERY_PARTITION - BYTES - DTBO_BYTES - BOOT_HEADER_BYTES ))
          {
            echo "### $BR / $VR"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| Image 字节 | $BYTES |"
            echo "| 留给 ramdisk（压缩后） | $BUDGET |"
            echo "| sha256 | \`$(sha256sum "$IMG" | cut -d' ' -f1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ matrix.branch }}-${{ matrix.variant }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 发布到 Releases
    needs: probe
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Image-*
          path: dist
          merge-multiple: true

      - name: Build SIZE-REPORT.md
        run: |
          set -eu
          ls -l dist
          {
            echo "# d1x 内核 Image 体积报告"
            echo ""
            echo "生成时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| 分支 | 变体 | Image 字节 | 留给 ramdisk（压缩后） |"
            echo "| --- | --- | --- | --- |"
            for f in dist/size-*.txt; do
              IFS='|' read -r b v bytes < "$f"
              budget=$(( 67633152 - bytes - 974848 - 2048 ))
              echo "| $b | $v | $bytes | $budget |"
            done
            echo ""
            echo "口径：分区 67,633,152，dtbo 974,848，boot header 2,048。"
            echo "预算为负说明该 Image 单靠自己就装不下，必须减体积。"
            echo ""
            echo "## SHA256"
            echo ""
            echo '```'
            sha256sum dist/Image-* | sed 's|dist/||'
            echo '```'
            echo ""
            echo "## 用法"
            echo ""
            echo "解包后把对应 Image 覆盖到 device/samsung/d1x/prebuilt/Image，"
            echo "然后 mka recoveryimage。别动公共树的 prebuilt，那里没有目录。"
          } > dist/SIZE-REPORT.md
          cat dist/SIZE-REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${{ inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="d1x-size-$(date -u +%Y%m%d-%H%M)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Image-* dist/SIZE-REPORT.md --clobber
          else
            gh release create "$TAG" dist/Image-* dist/SIZE-REPORT.md \
              --title "d1x kernel Image $TAG" \
              --notes-file dist/SIZE-REPORT.md
          fi
          echo "已发布：${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"

      - name: Summary link
        run: |
          echo "发布地址：${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.TAG }}" >> "$GITHUB_STEP_SUMMARY"
